name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.15"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint (includes bandit S rules)
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      - name: Tests
        run: uv run pytest -q

      - name: Demo
        run: uv run datapulse demo --workdir "$RUNNER_TEMP/datapulse-demo"

      - name: Audit locked dependencies
        run: |
          uv export --locked --format requirements-txt --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"
