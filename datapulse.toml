# Settings for `datapulse run --config datapulse.toml` / `datapulse check`.
# Every key is optional; unknown keys are rejected. Defaults are in src/datapulse/config.py.
[ingest]
max_future_skew_hours = 1       # later events are quarantined; freshness fails beyond this
settle_seconds = 5              # minimum age of a file's mtime before it is read

[checks]
min_orders = 100
max_quarantine_rate = 0.05      # quarantined lines / lines read, over loaded files
max_rejected_files = 1          # files rejected for schema drift
max_freshness_lag_hours = 24    # as_of minus the newest event_time in `orders`
max_duplicate_rate = 0.1        # in-file repeats of (order_id, event_time) / valid rows
amount_min = 0
amount_max = 100000

[checks.max_null_rate]
discount_code = 0.9
